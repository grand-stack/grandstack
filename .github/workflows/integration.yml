#
# Brings up each compose setup from the latest main of every repository and runs the checks that otherwise run by hand
# (browser end-to-end, live, smoke, and the website's examples). Nightly, after any repository's release, or by hand.
name: integration
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [repo-released]
concurrency:
  group: integration
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        setup: [default, agents, auth, federation, aura]
    steps:
      - uses: actions/checkout@v4
        with: { path: work/grandstack }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/grandstack-server", path: work/grandstack-server }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/grandstack-web", path: work/grandstack-web }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/grandstack-auth", path: work/grandstack-auth }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/grandstack-agents", path: work/grandstack-agents }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/grandstack-federation", path: work/grandstack-federation }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/grandstack-web-aura", path: work/grandstack-web-aura }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/grand-stack.github.io", path: work/grand-stack.github.io }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: ${{ matrix.setup }} setup
        id: checks
        # the federation setup calls the live Wikipedia API: its failure is reported below without failing the run
        continue-on-error: ${{ matrix.setup == 'federation' }}
        env:
          SETUP: ${{ matrix.setup }}
        run: work/grandstack/scripts/integration.sh "$SETUP"
      - name: Report a tolerated failure
        if: ${{ steps.checks.outcome == 'failure' }}
        run: |
          echo "::warning::The ${{ matrix.setup }} checks failed (tolerated: they depend on a live external service). See the step above."
          echo "### ${{ matrix.setup }} checks failed (tolerated)" >> "$GITHUB_STEP_SUMMARY"

