services:
  neo4j:
    image: neo4j:2026.10-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-grandstack-dev}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-grandstack-dev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  server:
    build: ../grandstack-server
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-grandstack-dev}
    ports:
      - "4000:4000"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
